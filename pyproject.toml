[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "track2ableton"
version = "0.1.0"
description = "Reverse-engineer a mixed track into an Ableton Live 12 rebuild package (stems, MIDI, devices, .als)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "soundfile>=0.12"]

[project.optional-dependencies]
demucs = ["demucs>=4.0"]
transcription = ["basic-pitch>=0.3"]
live = ["mcp>=1.2"]
vocal = ["cmudict>=1.0", "pyphen>=0.14"]
test = ["pytest>=7", "mido>=1.3"]

[project.scripts]
track2ableton = "track2ableton.cli:main"
track2ableton-mcp = "track2ableton.live.launch:main"
track2ableton-compose = "track2ableton.compose.__main__:main"
track2ableton-fix = "track2ableton.fix.__main__:main"
track2ableton-vocal = "track2ableton.vocal.__main__:main"
track2ableton-samplepack = "track2ableton.samplepack:main"
track2ableton-doctor = "track2ableton.doctor:main"

[tool.setuptools]
# The Remote Script that goes into Ableton's User Library ships inside the wheel as its own top-level package, so
# that `track2ableton-doctor --install-bridge` works from any installation, not only from a checkout.
packages = ["track2ableton", "track2ableton.ableton", "track2ableton.compose", "track2ableton.fix", "track2ableton.live",
            "track2ableton.vocal", "T2A_Bridge"]

[tool.setuptools.package-dir]
T2A_Bridge = "ableton_bridge/T2A_Bridge"

[tool.setuptools.package-data]
"track2ableton.ableton" = ["templates/*.gz", "templates/*.md"]
